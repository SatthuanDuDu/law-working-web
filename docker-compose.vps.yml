# VPS deploy with Caddy HTTPS (domain via DOMAIN env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luat}
      POSTGRES_DB: ${POSTGRES_DB:-luat_work}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SSH tunnel only (TablePlus) — not publicly reachable
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luat} -d ${POSTGRES_DB:-luat_work}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-luatminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-luatminio123}
    volumes:
      - minio_data:/data
    # Internal only — never publish; app proxies uploads/downloads same-origin
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-luatminio} $${S3_SECRET_KEY:-luatminio123};
      mc mb -p local/$${S3_BUCKET:-luat-attachments} || true;
      mc anonymous set none local/$${S3_BUCKET:-luat-attachments} || true;
      mc mb -p local/nslaw-web || true;
      mc anonymous set none local/nslaw-web || true;
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-luatminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-luatminio123}
      S3_BUCKET: ${S3_BUCKET:-luat-attachments}

  app:
    image: luat-work-manager:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${AUTH_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-luat}:${POSTGRES_PASSWORD:-luat}@db:5432/${POSTGRES_DB:-luat_work}?schema=public
      # Website CMS (schema cms) — same Postgres, nslaw_web role
      CMS_DATABASE_URL: postgresql://nslaw_web:${WEB_DB_PASSWORD}@db:5432/${POSTGRES_DB:-luat_work}?schema=cms
      CMS_S3_BUCKET: ${CMS_S3_BUCKET:-nslaw-web}
      SITE_URL: https://${WEB_DOMAIN:-nslaw.webme.io.vn}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-luat-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-luatminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-luatminio123}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://minio:9000}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      # Runtime public key (preferred). NEXT_PUBLIC_* is inlined at build and can stay empty.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@admin.com}
      CRON_SECRET: ${CRON_SECRET:-}
    # Reachable only via Caddy on the Docker network (no host :3000 publish)
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - nslaw-app
    mem_limit: 768m

  # Public marketing site (homepage-nslaw) — schema cms, read-only public."User"
  nslaw-web:
    image: homepage-nslaw:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://nslaw_web:${WEB_DB_PASSWORD}@db:5432/${POSTGRES_DB:-luat_work}?schema=cms
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://minio:9000
      S3_BUCKET: nslaw-web
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-luatminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-luatminio123}
      S3_REGION: ${S3_REGION:-auto}
      NEXT_PUBLIC_SITE_URL: https://${WEB_DOMAIN:-nslaw.webme.io.vn}
      # Shared with workspace SITE_REVALIDATE_SECRET
      REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
    expose:
      - "3000"
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - nslaw-web
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Law workspace (internal app)
      DOMAIN: ${DOMAIN:-work.nslaw.vn}
      # Public NSLAW website
      WEB_DOMAIN: ${WEB_DOMAIN:-nslaw.webme.io.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
